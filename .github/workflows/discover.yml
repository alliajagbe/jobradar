name: Discover boards

# Probes ATS slugs for the top H-1B sponsors in analyst occupations, so the
# search points at companies that demonstrably sponsor. Needs sponsorship data
# loaded first. Probe results are cached in data/probes.csv, so re-running costs
# nothing for slugs already tried.
on:
  workflow_dispatch:
    inputs:
      top:
        description: "Top N sponsors to probe"
        default: "300"

permissions:
  contents: write

concurrency:
  group: jobradar-data
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe for boards
        run: python -m jobradar -v discover --top ${{ inputs.top }} --apply
      - name: Commit
        run: |
          git config user.name  "jobradar"
          git config user.email "noreply@github.com"
          git add seeds/discovered.csv data/probes.csv
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Discover boards ($(date -u +%Y-%m-%d))"
          # A push landing during this run rebases cleanly onto it. Without the
          # retry the run's work is simply lost, which for the sponsorship job
          # is a 250MB download and twenty minutes of parsing.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
