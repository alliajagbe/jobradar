name: Crawl for boards

# The reach of a `site:greenhouse.io` search, without a search engine.
# Reads every public board token out of the Common Crawl URL index, fetches
# each one, and keeps the boards actually carrying a target role. Roughly 6,700
# candidates, so this is a long manual run, not something to do casually.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma separated (greenhouse,ashby,lever)"
        default: "greenhouse,ashby"
      limit:
        description: "Cap tokens per source (blank = all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: jobradar-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Enumerate and validate boards
        run: |
          python -m jobradar -v crawl --apply \
            --sources "${{ inputs.sources }}" \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - name: Commit
        run: |
          git config user.name  "jobradar"
          git config user.email "noreply@github.com"
          git add seeds/discovered.csv data/probes.csv
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Crawl for boards ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected, rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          exit 1
