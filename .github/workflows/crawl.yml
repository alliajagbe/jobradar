name: Crawl for boards

# The reach of a `site:greenhouse.io` search, without a search engine.
#
# Takes the board tokens in data/cc_tokens.csv (enumerated from the Common Crawl
# URL index by `python -m jobradar crawl --enumerate`, which must run somewhere
# Common Crawl will talk to), fetches each board, and keeps the ones actually
# carrying a target role. Roughly 6,800 candidates, so this is a long manual
# run, not something to do casually.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Validates data/cc_tokens.csv; enumerate locally first"
        default: "validate committed tokens"

permissions:
  contents: write

concurrency:
  group: jobradar-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Enumeration is NOT done here. Common Crawl throttles cloud IPs hard
      # enough that a runner reliably gets 503 where a laptop does not, and the
      # first version of this workflow reported success having read zero tokens.
      # The token list is enumerated locally and committed; this validates it.
      - name: Validate boards from the committed token list
        run: python -m jobradar -v crawl --from-file --apply --workers 8
      - name: Commit
        run: |
          git config user.name  "jobradar"
          git config user.email "noreply@github.com"
          git add seeds/discovered.csv data/probes.csv
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Crawl for boards ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected, rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          exit 1
