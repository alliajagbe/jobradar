# A discovered board can be a gambling company this list has never heard of, so
# the description is checked too. These terms are specific enough that they do
# not appear outside the industry; do not add generic words like "betting" or
# "odds", which show up in ordinary analytics writing.
excluded_description_terms:
  - sportsbook
  - igaming
  - online casino
  - online gambling
  - wagering
  - casino resort
  - lottery operator
  - betting platform
  - daily fantasy sports
