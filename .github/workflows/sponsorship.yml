name: Load sponsorship data

# Quarterly at most. Downloads roughly 250MB of Department of Labor H-1B filing
# data per fiscal year and compacts it to data/sponsors.csv.gz. Runs here rather
# than on a laptop precisely because of that download.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Fiscal years to ingest"
        default: "2"

permissions:
  contents: write

concurrency:
  group: jobradar-data
  cancel-in-progress: false

jobs:
  sponsorship:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest DOL LCA data
        run: python -m jobradar sponsorship --years ${{ inputs.years }}
      - name: Rescore with the new signal
        run: python -m jobradar -v refresh
      - name: Commit
        run: |
          git config user.name  "jobradar"
          git config user.email "noreply@github.com"
          git add data docs/data
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Load DOL sponsorship data ($(date -u +%Y-%m-%d))"
          # A push landing during this run rebases cleanly onto it. Without the
          # retry the run's work is simply lost, which for the sponsorship job
          # is a 250MB download and twenty minutes of parsing.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
