name: Discover boards

# Probes ATS slugs for the top H-1B sponsors in analyst occupations, so the
# search points at companies that demonstrably sponsor. Needs sponsorship data
# loaded first. Probe results are cached in data/probes.csv, so re-running costs
# nothing for slugs already tried.
#
# The default was 300, which is 0.5% of the 64,168 employers on file, and the
# cut-off was doing real damage: Tower Research Capital ranks 1246th by analyst
# sponsorships, has an ordinary Greenhouse board, and its correct slug is the
# FIRST candidate generated for it. It was invisible until Alli asked about the
# company by name. A probe costs about 0.8s and is cached forever, so reaching
# further is bounded work that only has to happen once per employer.
on:
  workflow_dispatch:
    inputs:
      top:
        description: "Top N sponsors to probe"
        default: "2000"

permissions:
  contents: write

concurrency:
  group: jobradar-data
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe for boards
        run: python -m jobradar -v discover --top ${{ inputs.top }} --max-probes 25000 --apply
      - name: Commit
        run: |
          git config user.name  "jobradar"
          git config user.email "noreply@github.com"
          git add seeds/discovered.csv data/probes.csv
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Discover boards ($(date -u +%Y-%m-%d))"
          # A push landing during this run rebases cleanly onto it. Without the
          # retry the run's work is simply lost, which for the sponsorship job
          # is a 250MB download and twenty minutes of parsing.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
